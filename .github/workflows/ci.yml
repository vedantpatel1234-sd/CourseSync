name: CI

# Runs on every pull request and every push to master. A change is only safe to merge or
# deploy if all of these pass: lint, type-checks (app, tests, shared function logic), the full
# test suite (including the database isolation tests, which run an in-process Postgres and need
# no services or secrets) and a production build.

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the older, now-pointless run stop.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This workflow only reads the repository. No secrets are used anywhere in it.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json says and fails if it is out of date.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (app, tests, shared function logic)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails on a known high-severity vulnerability in anything the app ships to users.
      # Dev-only tooling is excluded, so a problem in a test library can't block a release.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
